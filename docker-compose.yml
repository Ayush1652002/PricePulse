# Local development helpers: a PostgreSQL database and a Redis server.
# Start:  docker compose up -d        Stop:  docker compose down
# The init script also creates a second database, pricepulse_test, used by the tests.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pricepulse
      POSTGRES_PASSWORD: pricepulse
      POSTGRES_DB: pricepulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricepulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
